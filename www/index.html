function vA(){var a=st(),m=st(Date.now()-29*864e5),dn=S.parties.map(p=>[p,bal(p.id)]).filter(x=>x[1]);var K=(k,v)=>`<div class=row><span>${k}</span><b class="${v<0?'neg':''}">${N(v)}</b></div>`;return `<h3>حسابداری</h3><div class=card><b>صورت سود و زیان (کل)</b>${K('فروش',a.sales)}${K('بهای تمام‌شده',-a.cogs)}${K('سود ناخالص',a.sales-a.cogs)}${K('هزینه‌ها',-a.exp)}${K('سود خالص',a.profit)}</div><div class=card><b>۳۰ روز اخیر</b>${K('فروش',m.sales)}${K('خرید',m.pur)}${K('هزینه',m.exp)}${K('سود خالص',m.profit)}</div><div class=card><b>ترازنامه ساده</b>${K('صندوق',a.cash)}${K('ارزش انبار',a.inv)}${K('طلب از مشتریان',dn.reduce((z,x)=>z+Math.max(0,x[1]),0))}${K('بدهی به تأمین‌کنندگان',-dn.reduce((z,x)=>z+Math.max(0,-x[1]),0))}</div><div class=card><b>حساب طرف‌ها</b>${dn.map(x=>`<div class=row><span>${E(x[0].name)}</span><b class="${x[1]>0?'pos':'neg'}">${x[1]>0?'بدهکار':'بستانکار'} ${N(Math.abs(x[1]))}</b></div>`).join('')||'<p class=k>تسویه</p>'}</div>`}
function vM(){return `<h3>بیشتر</h3><div class=card><b>دسته‌بندی‌ها</b>${S.cats.map(c=>`<div class=row><span>${E(c.name)}</span>${adm()?`<a onclick="S.cats=S.cats.filter(x=>x.id!='${c.id}');save();R()">✕</a>`:''}</div>`).join('')}<input id=nc placeholder="دسته جدید"><button class=s onclick="if(V('nc')){S.cats.push({id:I(),name:V('nc')});save();R()}">+ افزودن دسته</button></div><div class=card><b>مشتری / تأمین‌کننده</b>${S.parties.map(c=>`<div class=row><span>${E(c.name)}</span><b>${N(bal(c.id))}</b></div>`).join('')}<input id=npn placeholder="نام"><button class=s onclick="if(V('npn')){S.parties.push({id:I(),name:V('npn')});save();R()}">+ افزودن</button></div>${adm()?`<div class=card><b>کاربران (ایمیل گوگل)</b>${S.users.map((u,i)=>`<div class=row><span>${E(u.email)}<br><small class=k>${({admin:'مدیر',manager:'مدیر انبار',seller:'فروشنده'})[u.role]}</small></span>${i?`<a onclick="S.users.splice(${i},1);save();R()">✕</a>`:''}</div>`).join('')}<input id=ue type=email placeholder="ایمیل گوگل کاربر"><select id=ur><option value=seller>فروشنده (فقط فروش)</option><option value=manager>مدیر انبار</option><option value=admin>مدیر کل</option></select><button class=s onclick="var e=V('ue').trim().toLowerCase();if(e){S.users.push({email:e,role:V('ur')});save();R()}">+ افزودن کاربر</button>${sid?'':'<p class=k>برای افزودن کاربر باید با گوگل وارد شده باشی.</p>'}</div>`:''}<div class=card><button class=s onclick=bk()>پشتیبان‌گیری / بازیابی</button> ${me?`<button class=d onclick=gOut()>خروج (${E(me.email)})</button>`:'<button onclick="localStorage.removeItem(\'anbaroff\');location.reload()">ورود با گوگل</button>'}</div>`}
function bk(){sheet(`<h3>پشتیبان</h3><textarea id=bj rows=8>${E(JSON.stringify(S))}</textarea><button onclick="navigator.clipboard&&navigator.clipboard.writeText(V('bj'));toast('کپی شد')">کپی</button><button class=d onclick="try{S=JSON.parse(V('bj'));save();X();R()}catch(e){toast('فایل نامعتبر')}">بازیابی از متن</button>`)}
R()
</script></body></html>
